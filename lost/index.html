<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Portal</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
<nav>
    <div class="logo">
        Lost & Found Portal
    </div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Lost Items</a></li>
        <li><a href="#">Found Items</a></li>
        
    </ul>
</nav>


<section class="hero">
    <h1>Lost & Found Portal</h1>
    <p>Welcome to Lost & Found Portal</p>

<a href="lost-item.html">
    <button>Report Lost Item</button>
</a>
    <a href="found-item.html">
    <button>Report Found Item</button>
</a>
</section>
<section class="search">
    <input type="text" placeholder="Search Item...">
    <button>Search</button>
</section>
<section class="items">

    <h2>Recent Lost & Found Items</h2>

    <div class="cards">

        <div class="card">
            <img src="images/bag.png" alt="Bag">
            <h3>Lost Bag</h3>
            <p>Black College Bag</p>
            <button>View Details</button>
        </div>

        <div class="card">
            <img src="images/mobile.png" alt="Mobile">
            <h3>Found Mobile</h3>
            <p>Samsung Phone</p>
            <button>View Details</button>
        </div>

        <div class="card">
            <img src="images/wallet.png" alt="Wallet">
            <h3>Lost Wallet</h3>
            <p>Brown Leather Wallet</p>
            <button>View Details</button>
        </div>

    </div>

</section>

<script src="js/script.js"></script>
    
</body>
</html>
